<div class="container-fluid bg-light py-4">
  <div class="mb-4">
    <span class="text-muted small fw-bold">SECRETARÍA</span>
    <h1 class="h3 fw-bold mb-1">Inscripción</h1>
    <p class="text-muted mb-0">Crea el perfil del estudiante. El pago de inscripción se registra por separado en Cobros.</p>
  </div>

  @if (mensaje) {
    <div class="alert alert-success alert-dismissible" role="status">{{ mensaje }}<button type="button" class="btn-close" aria-label="Cerrar mensaje" (click)="mensaje = ''"></button></div>
  }
  @if (error) {
    <div class="alert alert-danger alert-dismissible" role="alert">{{ error }}<button type="button" class="btn-close" aria-label="Cerrar mensaje" (click)="error = ''"></button></div>
  }

  <section class="card border-0 shadow-sm p-3 p-md-4">
    <form #inscripcionForm="ngForm" (ngSubmit)="registrarEstudiante(inscripcionForm)" novalidate>
      <h2 class="h5 fw-bold mb-3">Datos del estudiante</h2>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="cuiInscripcion">CUI</label>
          <input id="cuiInscripcion" class="form-control" name="cui" [(ngModel)]="camposEstudiante.cui" minlength="13" maxlength="13" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="usuarioInscripcion">Nombre de usuario</label>
          <input id="usuarioInscripcion" class="form-control" name="usuario" [(ngModel)]="camposEstudiante.usuario" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="nombreInscripcion">Nombre</label>
          <input id="nombreInscripcion" class="form-control" name="nombre" [(ngModel)]="camposEstudiante.nombre" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="apellidoInscripcion">Apellido</label>
          <input id="apellidoInscripcion" class="form-control" name="apellido" [(ngModel)]="camposEstudiante.apellido" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="fechaNacimientoInscripcion">Fecha de nacimiento</label>
          <input id="fechaNacimientoInscripcion" class="form-control" type="date" name="fechaNacimiento" [(ngModel)]="camposEstudiante.fechaNacimiento" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="anioLectivoInscripcion">Año lectivo</label>
          <input id="anioLectivoInscripcion" class="form-control" [value]="anioLectivo || (cargandoAnio ? '' : 'No disponible')" disabled>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="claveInscripcion">Contraseña</label>
          <input id="claveInscripcion" class="form-control" type="password" name="clave" autocomplete="new-password" [(ngModel)]="camposEstudiante.clave" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="confirmarClaveInscripcion">Confirmar contraseña</label>
          <input id="confirmarClaveInscripcion" class="form-control" type="password" name="claveConfirmacion" autocomplete="new-password" [(ngModel)]="camposEstudiante.claveConfirmacion" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="tipoSangreInscripcion">Tipo de sangre</label>
          <input id="tipoSangreInscripcion" class="form-control" name="tipoSangre" [(ngModel)]="camposEstudiante.tipoSangre" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="alergiaInscripcion">Alergias</label>
          <input id="alergiaInscripcion" class="form-control" name="alergia" [(ngModel)]="camposEstudiante.alergia">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="encargadoInscripcion">Nombre del encargado</label>
          <input id="encargadoInscripcion" class="form-control" name="nombreEncargado" [(ngModel)]="camposEstudiante.nombreEncargado">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="telefonoEncargadoInscripcion">Teléfono del encargado</label>
          <input id="telefonoEncargadoInscripcion" class="form-control" name="telefonoEncargado" [(ngModel)]="camposEstudiante.telefonoEncargado">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="correoEncargadoInscripcion">Correo del encargado</label>
          <input id="correoEncargadoInscripcion" class="form-control" type="email" name="correoEncargado" [(ngModel)]="camposEstudiante.correoEncargado">
        </div>
      </div>

      <div class="d-flex justify-content-end mt-4">
        <button class="btn btn-primary" type="submit" [disabled]="guardando || cargandoAnio || anioLectivo <= 0 || inscripcionForm.invalid">
          <i class="bi bi-check-lg me-2"></i>Crear perfil de estudiante
        </button>
      </div>
    </form>
  </section>
</div>
