<div>
  <h5 class="fw-bold mb-1">Recupera tu contraseña</h5>
  <p class="text-muted small mb-4">
    Escribe los datos asociados a tu cuenta para recuperar tu clave.
  </p>

  <form #formulario="ngForm" (ngSubmit)="recuperarContrasena(formulario)">
    
    <div class="mb-3">
      <label for="usuarioRecu" class="form-label small fw-semibold">Usuario</label>
      <input
        id="usuarioRecu"
        name="usuario"
        type="text"
        class="form-control bg-light border-0 py-2"
        placeholder="Tu usuario"
        [(ngModel)]="usuario"
        required
      />
    </div>

    <div class="mb-3">
      <label for="fechaNacimiento" class="form-label small fw-semibold">Fecha de Nacimiento</label>
      <input
        id="fechaNacimiento"
        name="fechaNacimiento"
        type="date"
        class="form-control bg-light border-0 py-2"
        [(ngModel)]="fechaNacimiento"
        required
      />
    </div>

    <div class="mb-3">
      <label for="cui" class="form-label small fw-semibold">CUI</label>
      <input
        id="cui"
        name="cui"
        type="text"
        class="form-control bg-light border-0 py-2"
        placeholder="Ingresa tu CUI"
        [(ngModel)]="cui"
        required
      />
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2" [disabled]="cargando || formulario.invalid">
      {{ cargando ? 'Consultando...' : 'Recuperar clave' }}
    </button>
  </form>

  @if (estado) {
    <div class="alert alert-dismissible mt-3 py-2 small text-center" [class.alert-danger]="error" [class.alert-info]="!error" [attr.role]="error ? 'alert' : 'status'">
      {{ estado }}
      @if (claveRecuperada) {
        <div class="fw-bold mt-2">Clave: {{ claveRecuperada }}</div>
      }
      <button type="button" class="btn-close" aria-label="Cerrar mensaje" (click)="estado = ''; claveRecuperada = ''"></button>
    </div>
  }
</div>
