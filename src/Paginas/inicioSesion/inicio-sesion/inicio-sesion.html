<div>
    <h5 class="fw-bold mb-1">¡Qué gusto verte!</h5>
    <p class="text-muted small mb-4">Ingresa tus datos para continuar.</p>

    <form #formulario="ngForm" (ngSubmit)="iniciarSesion(formulario)">
    
    <!-- Campo Usuario -->
    <div class="mb-3">
        <label for="usuario" class="form-label small fw-semibold">Usuario</label>
        <input
        id="usuario"
        name="usuario"
        type="text"
        class="form-control bg-light border-0 py-2"
        placeholder="Ingresa tu usuario"
        (change)="usuario = txtUsuario.value"
        #txtUsuario
        />
    </div>

    <!-- Campo Contraseña con botón mostrar/ocultar -->
    <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
        <label for="clave" class="form-label small fw-semibold mb-0">Contraseña</label>
        <a routerLink="/recuperar-contrasena" class="small text-decoration-none">¿La olvidaste?</a>
        </div>
    
        <div class="input-group">
        <input
            id="clave"
            name="clave"
            [type]="mostrarContrasena ? 'text' : 'password'"
            class="form-control bg-light border-0 py-2"
            placeholder="Ingresa tu contraseña"
            (change)="clave = txtClave.value"
            #txtClave
        />
        <button
            class="btn btn-light border-0 bg-light text-muted px-3"
            type="button"
            (click)="mostrarContrasena = !mostrarContrasena"
            [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
            <i class="bi" [class.bi-eye]="!mostrarContrasena" [class.bi-eye-slash]="mostrarContrasena"></i>
        </button>
        </div>
    </div>

    <!-- Botón de Envío -->
    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
        Iniciar sesión
    </button>
    </form>

    @if (mensaje) {
        <div class="alert alert-warning mt-3 py-2 small text-center" role="status">
        {{ mensaje }}
    </div>
    }

</div>
